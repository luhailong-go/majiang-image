<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道家 Q 版 · 麻将牌资源</title>
<style>
:root{font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;color:#183e35;background:#e8dfca}*{box-sizing:border-box}body{margin:0;padding:28px;line-height:1.5}header{max-width:1300px;margin:auto}h1{margin:0 0 7px;color:#154e3e;font-size:32px}p{margin:7px 0 15px}a{color:#17654c}nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}button,select{border:1px solid #bb9a50;background:#fbf5e6;color:#214e40;border-radius:12px;padding:9px 17px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#1c6650;color:#fff4d5;box-shadow:inset 0 0 0 1px #e6cc85}.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center}main{max-width:1300px;margin:24px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:12px}.tile{background:#f7f0df;border:1px solid #c9b480;border-radius:15px;padding:10px 8px;text-align:center}.tile img{width:112px;height:160px;object-fit:contain;display:block;margin:auto;transition:transform .16s,filter .16s}.tile h2{font-size:20px;font-weight:400;margin:9px 0 2px}.tile small{display:block;font:11px ui-monospace,monospace;color:#6e725e}.tile a{font-size:12px;margin:0 4px}.dark .tile{background:#173e35;color:#f2e6c8}.dark .tile small,.dark .tile a{color:#d5c189}.selected .tile img{transform:translateY(-8px)}.disabled .tile img{filter:grayscale(1) brightness(.6)}.side .tile img{transform:rotate(270deg) scale(.85)}.tile[hidden]{display:none}.note{border-top:1px solid #bba674;padding-top:16px;max-width:1300px;margin:auto;font-size:14px}
</style></head><body><header><h1>道家 Q 版 · 麻将牌资源</h1><p>34 种基础牌、空白牌胚与统一牌背。整套 448×640 RGBA，可按比例缩小，符号另附矢量 SVG。</p><nav aria-label="牌型筛选"><button data-suit="all" aria-pressed="true">全部 36</button><button data-suit="characters" aria-pressed="false">万子 9</button><button data-suit="dots" aria-pressed="false">筒子 9</button><button data-suit="bamboo" aria-pressed="false">条子 9</button><button data-suit="honors" aria-pressed="false">字牌 7</button><button data-suit="base" aria-pressed="false">牌胚与牌背</button></nav><div class="controls"><label><input id="dark" type="checkbox"> 深色底预览</label><label>显示状态 <select id="state"><option value="normal">正常</option><option value="selected">选中上抬</option><option value="disabled">不可打</option><option value="side">右家朝向</option></select></label><a href="previews/tiles-contact-sheet.png">整套联系表</a><a href="previews/tile-states-alpha.png">状态与透明检查</a><a href="manifest.json">资源清单</a></div></header><main id="grid"></main><p class="note">手绘牌胚、牌背为内置模型生成；牌面文字及精确符号为原生矢量排版，非 34 次独立模型生成。原生输入 1024×1536，成品为等比缩小与透明轮廓整理后的 448×640；实际型号与质量未由宿主披露，来源记录逐件保存。<a href="../../docs/TILES_DELIVERY.md">交付说明</a></p>
<script>
const numerals=['一','二','三','四','五','六','七','八','九'];
const tiles=[];for(const [prefix,suit,suffix]of [['wan','characters','万'],['tong','dots','筒'],['tiao','bamboo','条']])for(let n=1;n<=9;n++)tiles.push({id:`${prefix}-${n}`,suit,label:numerals[n-1]+suffix,file:`faces/${prefix}-${n}.png`,symbol:`symbols/${prefix}-${n}.svg`});
for(const [id,label]of [['wind-east','东'],['wind-south','南'],['wind-west','西'],['wind-north','北'],['dragon-red','中'],['dragon-green','发'],['dragon-white','白']])tiles.push({id,suit:'honors',label,file:`faces/${id}.png`,symbol:`symbols/${id}.svg`});tiles.push({id:'blank',suit:'base',label:'空白牌胚',file:'tile-blank.png'},{id:'back',suit:'base',label:'统一牌背',file:'tile-back.png'});
const grid=document.querySelector('#grid');for(const t of tiles){const article=document.createElement('article');article.className='tile';article.dataset.suit=t.suit;const image=document.createElement('img');image.src=t.file;image.alt=t.label;image.loading='lazy';const heading=document.createElement('h2');heading.textContent=t.label;const small=document.createElement('small');small.textContent=t.id;const png=document.createElement('a');png.href=t.file;png.textContent='PNG';png.download='';article.append(image,heading,small,png);if(t.symbol){const vector=document.createElement('a');vector.href=t.symbol;vector.textContent='符号 SVG';vector.download='';article.append(vector)}grid.append(article)}
document.querySelectorAll('button[data-suit]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button[data-suit]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.tile').forEach(t=>t.hidden=b.dataset.suit!=='all'&&t.dataset.suit!==b.dataset.suit)}));document.querySelector('#dark').addEventListener('change',e=>document.body.classList.toggle('dark',e.target.checked));document.querySelector('#state').addEventListener('change',e=>{document.body.classList.remove('selected','disabled','side');if(e.target.value!=='normal')document.body.classList.add(e.target.value)});
</script></body></html>
