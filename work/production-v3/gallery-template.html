<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>麻将完整美术 · 独立素材组合</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#183d35;background:#ece7d7;font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{padding:17px 24px;background:#fff9e9;border-bottom:1px solid #bca16a}h1{font-size:23px;margin:0 0 4px}p{margin:3px 0}a{color:#165b4a}main{max-width:1680px;margin:auto;padding:16px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}button,select{font:inherit;color:#183d35;background:#fff9e9;border:1px solid #bca16a;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.viewer{position:relative;aspect-ratio:16/9;overflow:hidden;background:#123e34;border-radius:12px;box-shadow:0 4px 16px #163d3433}.stage{position:absolute;width:1600px;height:900px;transform-origin:top left;overflow:hidden}.layer{position:absolute;margin:0;border:0;white-space:pre-wrap;overflow:hidden;line-height:1.5}.image{display:flex;align-items:center;justify-content:center}.image img{display:block;object-fit:contain;max-width:none}.skin{background:transparent;border-style:solid;border-color:transparent}.native-button{background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center;overflow:visible;cursor:pointer}.native-button .paint{position:absolute;inset:0;pointer-events:none;transition:filter .1s}.native-button .label{position:relative;padding:0 12px;line-height:1.5;pointer-events:none}.native-button:hover:enabled .paint{filter:brightness(1.05)}.native-button:active:enabled .paint{filter:brightness(.85)}.native-button:focus-visible{outline:3px solid #d6b260;outline-offset:3px}.native-button:disabled{opacity:1;cursor:default}.details{background:#fff9e9;border:1px solid #d4c59d;border-radius:10px;padding:14px;margin-top:14px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail-grid h2{margin:0 0 8px;font-size:17px}.asset-links{max-height:225px;overflow:auto;font-size:12px;line-height:1.8}.asset-links a{display:block;overflow-wrap:anywhere}.note{font-size:13px;color:#72654d}.feedback{background:#e1ebd9;padding:8px 12px;border-radius:6px;min-height:40px;margin-top:10px}.settings{display:flex;gap:8px;flex-wrap:wrap}.settings button{font-size:13px}.is-active{background:#165b4a;color:#fff9e9}@media(max-width:750px){main{padding:9px}header{padding:14px}.detail-grid{grid-template-columns:1fr}h1{font-size:20px}.toolbar{gap:7px}.toolbar select{max-width:100%;font-size:13px}.note{font-size:12px}}
</style></head><body><header><h1>麻将完整美术 · 独立素材组合</h1><p>32 个页面与 75 个状态均由独立 PNG、原生文字和组合坐标构成。切换页面检查实际使用的素材，点击按钮检查返回关系。</p><p class="note">这是美术接入参考，使用示例数据；实际规则、账号、匹配和奖励服务由游戏工程绑定。</p></header><main>
<div class="toolbar"><label>页面 <select id="page"></select></label><label>状态 <select id="state"></select></label><button id="prev">上一页</button><button id="next">下一页</button><a href="../index.html">完整美术画廊</a><a href="../docs/PRODUCTION_ART_COMPLETION_V3.md">完成范围</a></div>
<div id="viewer" class="viewer"><div id="stage" class="stage" aria-label="独立素材组合画面"></div></div><div id="feedback" class="feedback" role="status" aria-live="polite">选择页面或状态开始查看。</div>
<section class="details"><div class="detail-grid"><div><h2 id="name"></h2><p id="description" class="note"></p><div id="settings" class="settings"></div><p class="note">坐标为 1600×900 设计像素。窗框和皮肤遵循各自九宫格，人物、图标与牌面保持等比。文字和数量可替换。</p></div><div><h2>此画面引用的独立素材</h2><div id="assets" class="asset-links"></div></div></div></section>
</main><script>
const DATA=__PRODUCTION_DATA__;
const $=id=>document.getElementById(id);let current='UI03',activeState='',chosenRole='daotong',theme=0,appliedTheme=0,claimDone=false;
const roleNames={daotong:'金带道童',healer:'银发医师',master:'白眉老道',swordswoman:'黑发侠女'};
function path(file){return '../'+file}
function choosePage(id){current=id;activeState='';$('page').value=id;updateStateOptions();render()}
function updateStateOptions(){$('state').replaceChildren(new Option('默认组成',''));for(const state of DATA.states.filter(x=>x.uiId===current))$('state').add(new Option(state.state,state.state));$('state').value=activeState;}
function paint(el,node,file){
 if(node.sourceRect){const [x0,y0,x1,y1]=node.sourceRect,s=DATA.assets[file];let sx=node.rect[2]/(x1-x0),sy=node.rect[3]/(y1-y0);if(node.fitMode!=='stretch_x')sx=sy=Math.min(sx,sy);el.style.backgroundImage='url("'+path(file)+'")';el.style.backgroundSize=(s.width*sx)+'px '+(s.height*sy)+'px';el.style.backgroundPosition=(-x0*sx+(node.rect[2]-(x1-x0)*sx)/2)+'px '+(-y0*sy+(node.rect[3]-(y1-y0)*sy)/2)+'px';el.style.backgroundRepeat='no-repeat';if(node.clipFraction!==undefined)el.style.clipPath='inset(0 '+(100*(1-node.clipFraction))+'% 0 0)';}
 else if(node.nineSlice){const [l,t,r,b]=node.nineSlice;const size=DATA.assets[file];const scale=node.stretchAxes&&!node.stretchAxes.includes('y')?node.rect[3]/size.height:Math.min(1,node.rect[2]/size.width,node.rect[3]/size.height);el.classList.add('skin');el.style.borderWidth=[t,r,b,l].map(v=>Math.max(1,Math.round(v*scale))+'px').join(' ');el.style.borderImageSource='url("'+path(file)+'")';el.style.borderImageSlice=[t,r,b,l].join(' ')+' fill';el.style.borderImageRepeat='stretch';}
 else{el.classList.add('image');const img=document.createElement('img');img.src=path(file);img.alt='';img.onload=()=>{const angle=node.rotation||0;const rw=angle%180?img.naturalHeight:img.naturalWidth,rh=angle%180?img.naturalWidth:img.naturalHeight;const scale=node.fitMode==='cover'?Math.max(node.rect[2]/rw,node.rect[3]/rh):Math.min(node.rect[2]/rw,node.rect[3]/rh);img.style.width=img.naturalWidth*scale+'px';img.style.height=img.naturalHeight*scale+'px';if(angle)img.style.transform='rotate('+angle+'deg)';};el.append(img);}
}
function action(node){
 if(node.themeIndex!==undefined){theme=node.themeIndex;render();$('feedback').textContent='已选择桌面主题，点击应用装扮后到牌桌查看。';return}
 if(node.role){chosenRole=node.role;choosePage('UI26');return}
 if(node.action==='claim'){claimDone=true;activeState='reward.claimed';$('state').value=activeState;render();return}
 if(node.target){choosePage(node.target);return}
 if(current==='UI25'){appliedTheme=theme;render();$('feedback').textContent='已应用示例主题；到四人牌桌查看独立纹理。';return}
 $('feedback').textContent=(node.text||'此项')+'：已显示本地操作反馈，真实业务状态由游戏工程绑定。';
}
function render(){
 const page=DATA.pages.find(x=>x.id===current);const state=DATA.states.find(x=>x.state===activeState);let layers=structuredClone(state?state.layers:page.layers);
 if(current==='UI26')for(const n of layers){const character=DATA.characterCatalog[chosenRole];if(n.binding?.endsWith('.fullBody.file')){n.file=character.fullBody.file;n.asset='fullbody-'+chosenRole;}if(n.binding?.includes('.expressions.')&&n.binding.endsWith('.file')){const emotion=n.binding.split('.expressions.')[1].split('.')[0];n.asset='expression-'+chosenRole+'-'+emotion;n.file=character.expressions[emotion].file;}if(n.binding?.endsWith('.displayName'))n.text=character.displayName;if(n.binding?.endsWith('.description'))n.text=character.description;}
 if(current==='UI25')for(const n of layers)if(n.type==='button'&&n.text==='应用装扮')n.text=['应用青玉主题','应用竹影主题','应用月白主题'][theme];
 if(['UI09','UI10'].includes(current)&&appliedTheme>0){const bg=layers.find(n=>n.file===DATA.themeFiles[0]);if(bg)bg.file=DATA.themeFiles[appliedTheme];}
 $('stage').replaceChildren();
 for(const n of layers){const el=document.createElement(n.type==='button'?'button':'div');el.className='layer';const [x,y,w,h]=n.rect;Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  if(n.type==='text'){el.textContent=n.text;el.style.fontSize=n.fontSize+'px';el.style.color=n.color;el.style.textAlign=n.align||'left';}
  else if(n.type==='button'){el.type='button';el.classList.add('native-button');el.disabled=n.enabled===false;const skin=document.createElement('div');skin.className='paint';const mode=el.disabled?'disabled':n.previewState||'normal';paint(skin,n,n.stateAssets?.[mode]||n.file);const label=document.createElement('span');label.className='label';label.textContent=n.text;label.style.fontSize=n.fontSize+'px';label.style.color=el.disabled?'#777160':n.color;el.append(skin,label);el.onclick=()=>action(n);}
  else{paint(el,n,n.file);if(n.interactive){el.tabIndex=0;el.setAttribute('role','button');el.style.cursor='pointer';el.setAttribute('aria-label',n.asset);el.onclick=()=>action(n);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(n)}};}}
  $('stage').append(el);
 }
 $('name').textContent=page.id+' · '+page.name;$('description').textContent=activeState?'状态：'+activeState+'；对应独立素材和文字层已分开。':'默认组成，共 '+layers.length+' 个独立层；与整屏设计原画分别登记。';
 const files=[...new Set(layers.filter(n=>n.file).map(n=>n.file))].sort();$('assets').replaceChildren();for(const file of files){const a=document.createElement('a');a.href=path(file);a.target='_blank';a.rel='noopener';a.textContent=file;$('assets').append(a)}
 $('settings').replaceChildren();if(current==='UI26')for(const [role,name] of Object.entries(roleNames)){const b=document.createElement('button');b.textContent=name;b.className=role===chosenRole?'is-active':'';b.onclick=()=>{chosenRole=role;render()};$('settings').append(b)}
 $('feedback').textContent=activeState?'已显示 '+activeState+' 的美术组成。':'已切换到 '+page.name+'。';resize();
}
function resize(){const scale=$('viewer').clientWidth/1600;$('stage').style.transform='scale('+scale+')';}
for(const page of DATA.pages)$('page').add(new Option(page.id+' · '+page.name,page.id));$('page').value=current;$('page').onchange=()=>choosePage($('page').value);$('state').onchange=()=>{activeState=$('state').value;render()};
$('prev').onclick=()=>{const i=DATA.pages.findIndex(x=>x.id===current);choosePage(DATA.pages[(i+31)%32].id)};$('next').onclick=()=>{const i=DATA.pages.findIndex(x=>x.id===current);choosePage(DATA.pages[(i+1)%32].id)};
window.addEventListener('resize',resize);document.addEventListener('keydown',e=>{if(e.key==='Escape')choosePage('UI03')});updateStateOptions();render();
</script></body></html>
