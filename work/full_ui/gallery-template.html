<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻将 UI · 美术交付画廊</title>
<style>
:root{--ink:#183d35;--jade:#165b4a;--cream:#f5f0e3;--paper:#fffdf6;--gold:#bca16a;--muted:#67786e}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.65 "Microsoft YaHei",sans-serif}header{padding:42px max(5vw,24px) 28px;background:linear-gradient(110deg,#103e34,#236853);color:#fdf4d9;border-bottom:5px solid var(--gold)}.eyebrow{font-size:12px;letter-spacing:.2em;color:#cbbc92}h1{font-size:35px;margin:8px 0;font-weight:600}header p{max-width:850px;margin:8px 0;color:#e6e8d9}header a{color:#f2d39a}.stats{display:flex;gap:36px;margin-top:23px}.stat strong{font-size:26px;display:block}.stat span{font-size:12px;color:#d4dfd5}
.toolbar{position:sticky;top:0;z-index:5;background:#f5f0e3f7;backdrop-filter:blur(10px);border-bottom:1px solid #d7cebb;padding:16px max(5vw,24px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.tabs,.filters{display:flex;gap:7px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer;border:1px solid #c9bc9e;border-radius:7px;background:var(--paper);color:var(--ink);padding:8px 15px}button:hover{border-color:var(--jade);box-shadow:0 2px 10px #173b3214}button.active{background:var(--jade);color:#fff8df;border-color:var(--jade)}input{padding:9px 13px;border:1px solid #c9bc9e;border-radius:7px;width:230px;background:var(--paper)}
main{padding:28px max(5vw,24px) 60px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 18px;gap:20px}h2{font-size:23px;margin:0}.subtle{color:var(--muted);font-size:13px}.filters{margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:var(--paper);border:1px solid #d8cdb5;border-radius:11px;overflow:hidden;box-shadow:0 4px 18px #173b3207}.preview{display:block;padding:0;width:100%;border:0;border-radius:0;background:#dbe6df;overflow:hidden;aspect-ratio:16/9}.preview img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}.preview:hover img{transform:scale(1.018)}.card-body{padding:15px 17px}.card h3{font-size:17px;margin:0 0 6px}.id{font-family:Consolas,monospace;font-size:12px;color:#877039;margin-right:8px}.meta{font-size:12px;color:var(--muted)}.links{margin-top:9px;display:flex;gap:14px}.links a{color:var(--jade);font-size:12px;text-decoration:none;border-bottom:1px dotted #9aaf9f}.asset-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.asset-grid .preview{aspect-ratio:1;background:repeating-conic-gradient(#e6e9e2 0 25%,#f6f7ef 0 50%) 0/22px 22px}.asset-grid .preview img{padding:9px;max-height:100%}.asset-grid .card h3{font-size:14px;overflow-wrap:anywhere}.dark .asset-grid .preview{background:#17392f}.tile-grid{grid-template-columns:repeat(9,minmax(0,1fr))}.tile-grid .preview{aspect-ratio:3/4}.tile-grid .card-body{padding:8px}.tile-grid .card h3{font-size:13px}.empty{padding:65px;text-align:center;color:var(--muted)}
dialog{padding:0;border:1px solid #ccb985;border-radius:10px;background:#112e27;color:#f6f0dd;max-width:96vw;max-height:96vh;width:min(1500px,96vw)}dialog::backdrop{background:#061b15db}.viewer-head{padding:12px 18px;display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #456056}.viewer-head button{padding:5px 12px;background:#1c493c;color:#fff4d8;border-color:#799087}.viewer-media{height:72vh;display:flex;align-items:center;justify-content:center;background:#17392f}.viewer-media.light{background:#f7f0dd}.viewer-media img{display:block;max-width:100%;max-height:100%;object-fit:contain}.viewer-foot{padding:10px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between;font-size:12px;color:#c1d0c4}.viewer-foot a{color:#ecd094}.view-controls{display:flex;gap:8px}footer{border-top:1px solid #d7cebb;padding:22px max(5vw,24px);font-size:12px;color:var(--muted)}
@media(min-width:1800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.asset-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.tile-grid{grid-template-columns:repeat(9,minmax(0,1fr))}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.asset-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:600px){h1{font-size:27px}.stats{gap:20px}.grid{grid-template-columns:1fr}.asset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar{position:static}input{width:100%}.viewer-media{height:62vh}}
</style></head><body>
<header><div class="eyebrow">道家 Q 版 · 玉绿与绢纸</div><h1>麻将 UI 美术交付画廊</h1><p>按页面、状态与基础素材浏览完整交付。点击图片查看原尺寸；人物和透明组件可切换深浅底检查。这里用于查看美术文件，不是可联机麻将客户端。</p><div class="stats" id="stats"></div><p class="subtle"><a href="docs/FULL_UI_SCOPE.md">范围合同</a> · <a href="docs/UI_INTEGRATION.md">接入说明</a> · <a href="exports/ui-delivery-manifest.json">机器可读清单</a> · <a href="README.md">项目说明</a></p></header>
<div class="toolbar"><div class="tabs"><button data-tab="pages" class="active">页面与状态板</button><button data-tab="components">透明组件</button><button data-tab="tiles">麻将牌面</button><button data-tab="characters">角色与头像</button></div><input id="search" type="search" placeholder="搜索页面编号、名称或素材" aria-label="搜索"></div>
<main><div class="section-head"><div><h2 id="section-title"></h2><div class="subtle" id="section-note"></div></div><button id="bg" hidden>切换深浅底</button></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
<footer>目标：GPT Image 2.5 Sunburst / max · 内置工具未披露的实际型号与质量均记为未确认。显示尺寸以文件和逐图记录为准；派生素材保留来源、裁切/缩放与状态映射。</footer>
<dialog id="viewer"><div class="viewer-head"><strong id="view-title"></strong><div class="view-controls"><button id="prev" aria-label="上一张">←</button><button id="next" aria-label="下一张">→</button><button id="view-bg">深浅底</button><button id="close">关闭 ×</button></div></div><div class="viewer-media" id="view-media"><img id="view-img" alt=""></div><div class="viewer-foot"><span id="view-info"></span><a id="view-open" target="_blank">打开原图</a></div></dialog>
<script>
const DATA=__DELIVERY_DATA__;
let tab="pages",filter="all",visible=[],current=0;const $=s=>document.querySelector(s);
const titles={pages:"页面与状态规范",components:"透明组件与控件",tiles:"34 种牌面与基础牌材",characters:"迎宾道童与四座头像"};
const notes={pages:"每个页面独立生成；UI23、UI24 按规范板交付。",components:"文字与皮肤分离；九宫格、状态与锚点见组件清单。",tiles:"生成手绘牌胚 + 确定性符号排版，逐张检查语义与数量。",characters:"统一人物身份、画法与色彩。透明立绘已检查深浅底边缘。"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("#stats").innerHTML=[["合同页面",DATA.contractCompleteCount+"/24"],["独立成图",DATA.pages.length],["组件",DATA.components.length],["基础牌面",DATA.tileFaceCount]].map(([label,n])=>'<div class="stat"><strong>'+n+'</strong><span>'+label+'</span></div>').join("");
function render(){const list=DATA[tab]||[],q=$("#search").value.trim().toLowerCase();visible=list.filter(x=>(filter==="all"||x.group===filter)&&(!q||((x.id||"")+" "+x.title+" "+x.file).toLowerCase().includes(q)));$("#section-title").textContent=titles[tab];$("#section-note").textContent=notes[tab];$("#bg").hidden=tab==="pages";$("#grid").className="grid"+(tab==="pages"?"":" asset-grid")+(tab==="tiles"?" tile-grid":"");$("#grid").innerHTML=visible.map((x,i)=>'<article class="card"><button class="preview" data-view="'+i+'" aria-label="查看'+esc(x.title)+'"><img loading="lazy" src="'+encodeURI(x.file)+'" alt="'+esc(x.title)+'"></button><div class="card-body"><h3>'+(x.id?'<span class="id">'+esc(x.id)+'</span>':"")+esc(x.title)+'</h3><div class="meta">'+esc(x.width+" × "+x.height+" · "+(x.mode||"PNG"))+'</div><div class="links">'+(x.record?'<a href="'+encodeURI(x.record)+'" target="_blank">来源记录</a>':"")+(x.prompt?'<a href="'+encodeURI(x.prompt)+'" target="_blank">提示词</a>':"")+'</div></div></article>').join("")||'<div class="empty">没有匹配的素材</div>';document.querySelectorAll("[data-view]").forEach(el=>el.onclick=()=>show(+el.dataset.view));}
function groups(){const values=[...new Set((DATA[tab]||[]).map(x=>x.group).filter(Boolean))];$("#filters").innerHTML=[["all","全部"],...values.map(v=>[v,v])].map(([v,t])=>'<button data-filter="'+esc(v)+'" class="'+(v===filter?"active":"")+'">'+esc(t)+'</button>').join("");document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;groups();render()})}
function show(i){current=(i+visible.length)%visible.length;const x=visible[current];$("#view-title").textContent=(x.id?x.id+" · ":"")+x.title;$("#view-img").src=encodeURI(x.file);$("#view-img").alt=x.title;$("#view-info").textContent=x.width+" × "+x.height+" · "+(x.mode||"PNG")+" · "+(current+1)+"/"+visible.length;$("#view-open").href=encodeURI(x.file);if(!$("#viewer").open)$("#viewer").showModal()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;filter="all";document.querySelectorAll("[data-tab]").forEach(e=>e.classList.toggle("active",e===b));groups();render()});$("#search").oninput=render;$("#bg").onclick=()=>document.body.classList.toggle("dark");$("#view-bg").onclick=()=>$("#view-media").classList.toggle("light");$("#close").onclick=()=>$("#viewer").close();$("#prev").onclick=()=>show(current-1);$("#next").onclick=()=>show(current+1);document.addEventListener("keydown",e=>{if($("#viewer").open&&e.key==="ArrowLeft")show(current-1);if($("#viewer").open&&e.key==="ArrowRight")show(current+1)});groups();render();
</script></body></html>
